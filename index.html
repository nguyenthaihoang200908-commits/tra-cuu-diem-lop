<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Học Sinh - Tra Cứu Lớp Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2P8pOJUA4yex7-f34oBJMeu8KZjNCg_U",
            authDomain: "quan-ly-lop-hoc-5a254.firebaseapp.com",
            projectId: "quan-ly-lop-hoc-5a254",
            storageBucket: "quan-ly-lop-hoc-5a254.firebasestorage.app",
            messagingSenderId: "862050242762",
            appId: "1:862050242762:web:7fade93a7fe8d1f5cb2433",
            measurementId: "G-G8KVTKMT6C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentStudentData = null;
        let currentClassData = null;

        // Xử lý đăng nhập vào lớp
        window.loginClass = async function() {
            let classId = document.getElementById("classIdInput").value.trim().toUpperCase();
            let password = document.getElementById("passwordInput").value.trim();
            let studentNameQuery = document.getElementById("studentNameInput").value.trim().toLowerCase();

            if (!classId || !password || !studentNameQuery) {
                alert("Vui lòng nhập đầy đủ ID lớp, Mật khẩu và Họ tên của bạn!");
                return;
            }

            try {
                const docRef = doc(db, "classes", classId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    alert("Không tìm thấy lớp học này!");
                    return;
                }

                currentClassData = docSnap.data();

                if (currentClassData.password !== password) {
                    alert("Mật khẩu lớp học không chính xác!");
                    return;
                }

                let student = currentClassData.students.find(s => s.name.toLowerCase().includes(studentNameQuery));
                if (!student) {
                    alert("Không tìm thấy tên học sinh trong danh sách lớp. Vui lòng kiểm tra lại họ tên!");
                    return;
                }

                currentStudentData = student;

                // Chuyển sang giao diện trong lớp
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("dashboardBox").style.display = "block";
                document.getElementById("displayClassName").innerText = currentClassData.className + " (" + classId + ")";
                document.getElementById("displayStudentName").innerText = student.name;

                // Nạp dữ liệu mặc định cho 3 chức năng
                loadNotesContent();
                loadDocumentsContent();
                loadGradesContent();

                // Mặc định hiển thị chức năng 1 (Xem ghi chú)
                switchStudentTab('notes');

            } catch (error) {
                console.error("Lỗi đăng nhập: ", error);
                alert("Đã xảy ra lỗi kết nối cơ sở dữ liệu!");
            }
        };

        // Chuyển đổi giữa 3 tab chức năng trong lớp
        window.switchStudentTab = function(tabName) {
            ["notes", "documents", "grades"].forEach(t => {
                let section = document.getElementById("section_" + t);
                let btn = document.getElementById("tabBtn_" + t);
                if (t === tabName) {
                    section.style.display = "block";
                    btn.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 transition text-sm";
                } else {
                    section.style.display = "none";
                    btn.className = "flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 transition text-sm";
                }
            });
        };

        // Chức năng 1: Xem ghi chú
        function loadNotesContent() {
            let notesText = currentClassData.notes ? currentClassData.notes : "Chưa có ghi chú hay dặn dò nào từ giáo viên.";
            document.getElementById("studentNotesContent").innerText = notesText;
        }

        // Chức năng 2: Xem tài liệu
        function loadDocumentsContent() {
            let docHTML = "";
            if (currentClassData.documents && currentClassData.documents.length > 0) {
                currentClassData.documents.forEach(d => {
                    docHTML += `
                    <div class="flex justify-between items-center p-3 bg-gray-50 border rounded-lg hover:bg-blue-50 transition">
                        <span class="text-sm font-medium text-gray-800 flex items-center gap-2">📄 ${d.name}</span>
                        <a href="${d.url}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-semibold shadow">Tải về / Xem</a>
                    </div>`;
                });
            } else {
                docHTML = "<p class='text-sm text-gray-400 italic text-center py-4'>Chưa có tài liệu học tập nào được tải lên.</p>";
            }
            document.getElementById("studentDocList").innerHTML = docHTML;
        }

        // Chức năng 3: Xem điểm
        function loadGradesContent() {
            let gradeContainer = document.getElementById("studentGradeContent");

            // Kiểm tra xem giáo viên đã công khai điểm chưa
            if (!currentClassData.isGradePublic) {
                gradeContainer.innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <p class="text-lg font-semibold text-orange-600 mb-1">🔒 Sổ điểm đang tạm khóa</p>
                    <p class="text-sm">Giáo viên chưa mở cổng công khai sổ điểm cho lớp học này.</p>
                </div>`;
                return;
            }

            let student = currentStudentData;
            let htmlDetails = "";
            let sum1 = 0, weight1 = 0;
            let sum2 = 0, weight2 = 0;

            // Bảng điểm Học kỳ 1
            htmlDetails += `<h3 class="font-bold text-blue-700 mb-2 text-sm uppercase tracking-wide">📚 Học Kỳ 1</h3>`;
            htmlDetails += `<div class="bg-gray-50 border rounded-lg p-3 mb-4 space-y-2">`;
            if (currentClassData.columnsHK1) {
                currentClassData.columnsHK1.forEach(col => {
                    let sc = student.scores && student.scores[col.id] !== undefined ? student.scores[col.id] : "-";
                    htmlDetails += `<div class="flex justify-between text-sm border-b pb-1"><span class="text-gray-600">${col.name} (Hệ số ${col.weight}):</span> <span class="font-bold">${sc}</span></div>`;
                    if (sc !== "" && sc !== "-") { sum1 += parseFloat(sc) * col.weight; weight1 += col.weight; }
                });
            }
            let avg1 = weight1 > 0 ? (sum1 / weight1).toFixed(1) : "-";
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-yellow-800 pt-1"><span>🌟 Điểm đánh dấu / Thưởng HK1:</span> <span>${student.marksHK1 || 0} lần</span></div>`;
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-blue-800 pt-1 border-t"><span>Điểm Trung Bình HK1:</span> <span class="text-base">${avg1}</span></div>`;
            htmlDetails += `</div>`;

            // Bảng điểm Học kỳ 2
            htmlDetails += `<h3 class="font-bold text-blue-700 mb-2 text-sm uppercase tracking-wide">📚 Học Kỳ 2</h3>`;
            htmlDetails += `<div class="bg-gray-50 border rounded-lg p-3 mb-4 space-y-2">`;
            if (currentClassData.columnsHK2) {
                currentClassData.columnsHK2.forEach(col => {
                    let sc = student.scores && student.scores[col.id] !== undefined ? student.scores[col.id] : "-";
                    htmlDetails += `<div class="flex justify-between text-sm border-b pb-1"><span class="text-gray-600">${col.name} (Hệ số ${col.weight}):</span> <span class="font-bold">${sc}</span></div>`;
                    if (sc !== "" && sc !== "-") { sum2 += parseFloat(sc) * col.weight; weight2 += col.weight; }
                });
            }
            let avg2 = weight2 > 0 ? (sum2 / weight2).toFixed(1) : "-";
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-yellow-800 pt-1"><span>🌟 Điểm đánh dấu / Thưởng HK2:</span> <span>${student.marksHK2 || 0} lần</span></div>`;
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-blue-800 pt-1 border-t"><span>Điểm Trung Bình HK2:</span> <span class="text-base">${avg2}</span></div>`;
            htmlDetails += `</div>`;

            // Tổng kết cả năm
            let yearAvg = "-";
            let rank = "-";
            if (avg1 !== "-" && avg2 !== "-") {
                let calc = (parseFloat(avg1) + parseFloat(avg2) * 2) / 3;
                yearAvg = calc.toFixed(1);
                if (calc >= 8.0) rank = "Giỏi";
                else if (calc >= 6.5) rank = "Khá";
                else if (calc >= 5.0) rank = "Trung bình";
                else rank = "Yếu";
            }

            htmlDetails += `<h3 class="font-bold text-green-700 mb-2 text-sm uppercase tracking-wide">🏆 Tổng Kết Cả Năm</h3>`;
            htmlDetails += `<div class="bg-green-50 border border-green-200 rounded-lg p-4 space-y-2">`;
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-green-900"><span>Điểm TB Môn Cả Năm:</span> <span class="text-lg">${yearAvg}</span></div>`;
            htmlDetails += `<div class="flex justify-between text-sm font-bold text-gray-700"><span>Xếp loại học lực:</span> <span>${rank}</span></div>`;
            htmlDetails += `</div>`;

            gradeContainer.innerHTML = htmlDetails;
        }

        window.logout = function() {
            document.getElementById("dashboardBox").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
            document.getElementById("studentNameInput").value = "";
        };
    </script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white shadow-xl rounded-2xl p-6 overflow-hidden">
        
        <!-- MÀN HÌNH ĐĂNG NHẬP -->
        <div id="loginBox">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">Tra Cứu Học Tập</h1>
            <p class="text-center text-gray-500 text-sm mb-6">Đăng nhập vào lớp học của bạn để xem ghi chú, tài liệu và điểm số.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ID Lớp Học</label>
                    <input type="text" id="classIdInput" placeholder="VD: TOAN10A1" class="w-full border rounded-lg p-3 text-sm uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật Khẩu Lớp</label>
                    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu lớp" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Họ và Tên Của Bạn</label>
                    <input type="text" id="studentNameInput" placeholder="VD: Nguyễn Văn A" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button onclick="loginClass()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md">Vào Lớp Học</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHÍNH TRONG LỚP (GỒM 3 CHỨC NĂNG) -->
        <div id="dashboardBox" style="display: none;">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <div>
                    <h2 id="displayStudentName" class="text-lg font-bold text-gray-800">Tên Học Sinh</h2>
                    <p id="displayClassName" class="text-xs text-gray-500 font-semibold">Tên lớp</p>
                </div>
                <button onclick="logout()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-bold text-gray-600 transition">Đăng xuất</button>
            </div>

            <!-- 3 Nút Chức Năng (Tabs) -->
            <div class="flex border rounded-lg overflow-hidden mb-4 bg-gray-50">
                <button id="tabBtn_notes" onclick="switchStudentTab('notes')">1. Ghi Chú</button>
                <button id="tabBtn_documents" onclick="switchStudentTab('documents')">2. Tài Liệu</button>
                <button id="tabBtn_grades" onclick="switchStudentTab('grades')">3. Bảng Điểm</button>
            </div>

            <!-- Nội dung Chức năng 1: Xem Ghi Chú -->
            <div id="section_notes" class="space-y-3">
                <h3 class="font-bold text-gray-800 text-sm">📌 Dặn Dò Từ Giáo Viên</h3>
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-lg text-sm text-yellow-900 leading-relaxed" id="studentNotesContent">
                    Đang tải ghi chú...
                </div>
            </div>

            <!-- Nội dung Chức năng 2: Xem Tài Liệu -->
            <div id="section_documents" class="space-y-3" style="display: none;">
                <h3 class="font-bold text-gray-800 text-sm">📂 Tài Liệu Ôn Tập</h3>
                <div id="studentDocList" class="space-y-2 max-h-72 overflow-y-auto"></div>
            </div>

            <!-- Nội dung Chức năng 3: Xem Bảng Điểm -->
            <div id="section_grades" class="space-y-3" style="display: none;">
                <div id="studentGradeContent" class="max-h-80 overflow-y-auto pr-1"></div>
            </div>
        </div>

    </div>
</body>
</html>
